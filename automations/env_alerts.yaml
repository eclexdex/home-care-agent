- id: battery_low
  alias: Care Recipient - Low Battery
  trigger:
    - platform: state
      entity_id:
        - sensor.button_panic_usual_chair_battery
        - sensor.button_homeaway_door_battery
        - sensor.front_door_battery
        - sensor.back_door_battery
        - sensor.living_room_presence_battery
        - sensor.living_room_temp_battery
      to: 'unavailable'
  condition:
    - condition: template
      value_template: "{{ not is_state('input_boolean.battery_low_sent', 'on') }}"
  action:
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.battery_low_sent
    - service: notify.care_team_telegram
      data:
        message: "🔋 Low battery on a care sensor — check the panic button first."
  mode: single
