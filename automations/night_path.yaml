# Home Care Agent — Night path + presence check-in
#
# mmWave presence drives low-level, warm night lighting when it's dark —
# so a 3 a.m. trip doesn't end in a fall. Plus a quiet idle watch: if the
# usual-chair presence sensor has been still for a long stretch during the
# day, the family gets a gentle "just checking in" nudge.
#
# CARE POSTURE: this automation exists to light a path and to prompt a
# human call. It must never be extended into a movement log or an export.
#
# CHANGE THESE BEFORE FIRST USE:
#   - sensor.living_room_presence → mmWave presence entity after pairing
#   - light.night_path → real light entity
#   - notify.care_team_telegram → your notify service
#   - sun.sun exists by default in HA
#
- id: night_path
  alias: Care Recipient - Night Path (presence)
  trigger:
    - platform: state
      entity_id: sensor.living_room_presence
      to: 'on'
  condition:
    - condition: numeric_state
      entity_id: sun.sun
      attribute: elevation
      below: -6
  action:
    - service: light.turn_on
      target:
        entity_id: light.night_path
      data:
        brightness: 20
        color_temp_kelvin: 2700
  mode: restart

- id: presence_idle
  alias: Care Recipient - Presence Idle Check-in
  trigger:
    - platform: state
      entity_id: sensor.living_room_presence
      to: 'off'
  condition:
    - condition: numeric_state
      entity_id: sensor.living_room_presence
      above: 0
      minutes: 120
  action:
    - service: notify.care_team_telegram
      data:
        message: "ℹ️ No presence movement for >2h (quiet at {{ now().strftime('%H:%M') }}). Just checking in — call or knock."
  mode: single
